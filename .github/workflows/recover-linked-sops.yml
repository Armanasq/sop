name: Recover SOPs from linked author GitHub repository

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-linked-sops.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download original author-shared SOP PDFs
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          root = 'https://api.github.com/repos/siddu1998/Graduate-Admissions/git/trees/main?recursive=1'
          headers = {'User-Agent':'sop-archive/1.0'}
          def get(url):
              req = urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req, timeout=40) as r:
                  return r.read()

          listing = json.loads(get(root))['tree']
          docs = [x for x in listing if x['type']=='blob' and x['path'].lower().endswith('.pdf') and re.search(r'(sop|statement of purpose|statement of intent)', x['path'],re.I)]
          if len(docs)<10:
              raise SystemExit('Unexpectedly small linked SOP repository')
          base = pathlib.Path('2021/files')
          base.mkdir(parents=True,exist_ok=True)
          rows=[]
          for f in docs:
              original=f['path']
              slug=re.sub(r'[^A-Za-z0-9]+','_',original).strip('_')
              dest=base / ('Sai_Siddartha_Maram_'+slug)
              url='https://raw.githubusercontent.com/siddu1998/Graduate-Admissions/main/'+urllib.parse.quote(original,safe='/')
              try:
                  data=get(url)
                  if not data.startswith(b'%PDF-'): raise ValueError('Not a PDF')
                  if len(data)>20000000: raise ValueError('Oversized')
                  dest.write_bytes(data)
                  rows.append([original,str(dest),url,hashlib.sha256(data).hexdigest(),'downloaded'])
              except Exception as e:
                  rows.append([original,'',url,'','failed: '+str(e)[:120]])

          with open('2021/sai_siddartha_maram_documents.csv','w',newline='',encoding='utf-8') as f:
              writer=csv.writer(f);writer.writerow(['original_path','file','source_url','sha256','status']);writer.writerows(rows)
          success=[x for x in rows if x[4]=='downloaded']
          if not success:
              raise SystemExit('No original SOP files recovered')
          with open('2021/index.csv',newline='',encoding='utf-8') as f:
              manifest=list(csv.DictReader(f))
          for r in manifest:
              if r['name']=='Sai Siddartha Maram':
                  r['file']=success[0][1]
                  r['statement_url']='https://github.com/siddu1998/Graduate-Admissions'
                  r['sha256']=success[0][3]
                  r['status']='downloaded'
                  r['notes']='Multiple original PDFs; see 2021/sai_siddartha_maram_documents.csv'
          with open('2021/index.csv','w',newline='',encoding='utf-8') as f:
              writer=csv.DictWriter(f,fieldnames=list(manifest[0]));writer.writeheader();writer.writerows(manifest)
          p=pathlib.Path('SYNC_STATUS.json')
          status=json.loads(p.read_text(encoding='utf-8'))
          status['years']['2021']['downloaded']+=1
          status['years']['2021']['unresolved']-=1
          status['total_downloaded_documents']+=len(success)
          status['records_with_archived_documents']+=1
          status['unresolved_records']-=1
          status['github_sop_recovery']={'applicant':'Sai Siddartha Maram','downloaded_files':len(success),'failed_files':len(docs)-len(success),'source':'https://github.com/siddu1998/Graduate-Admissions'}
          p.write_text(json.dumps(status,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(status['github_sop_recovery']))
          PY
      - name: Commit recovered PDFs and index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Archive additional 2021 applicant SOPs from linked author repository"
            git push origin HEAD:main
          fi
